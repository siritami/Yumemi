name: Build Yukimi Artifact

on:
  workflow_dispatch:

env:
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: siritami/Yumemi
          ref: devel
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Resolve parsers version 🔍
        id: parsers
        run: |
          PARSERS_VERSION=$(curl -s https://api.github.com/repos/siritami/kotatsu-parsers/commits/master -H "Accept: application/vnd.github.sha" | cut -c -10)
          echo "version=$PARSERS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsers version: $PARSERS_VERSION"

      - name: Pre-warm JitPack ☕
        run: |
          ARTIFACT_URL="https://jitpack.io/com/github/siritami/kotatsu-parsers/${{ steps.parsers.outputs.version }}/kotatsu-parsers-${{ steps.parsers.outputs.version }}.pom"
          echo "Warming up JitPack: $ARTIFACT_URL"
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ARTIFACT_URL")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ JitPack artifact is ready!"
              break
            fi
            echo "⏳ Waiting 30s for JitPack to build..."
            sleep 30
          done
        timeout-minutes: 20

      - name: Setup signing key 🔑
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          echo "KEYSTORE_FILE=${{ github.workspace }}/keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Yukimi APK (Attempt 1) 💻
        run: |
          chmod a+x gradlew
          ./gradlew assembleDebug --no-configuration-cache \
          -DparsersVersionOverride=${{ steps.parsers.outputs.version }}
        continue-on-error: true
        timeout-minutes: 30

      - name: Build Yukimi APK (Attempt 2) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleDebug --no-configuration-cache \
            -DparsersVersionOverride=${{ steps.parsers.outputs.version }}
          else
            echo "✅ Yukimi build already exists, skipping build attempt 2";
          fi
        continue-on-error: true
        timeout-minutes: 30

      - name: Build Yukimi APK (Attempt 3) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleDebug --no-configuration-cache \
            -DparsersVersionOverride=${{ steps.parsers.outputs.version }}
          else
            echo "✅ Yukimi build already exists, skipping build attempt 3";
          fi
        continue-on-error: false
        timeout-minutes: 30

      - name: Upload APK artifact 📤
        uses: ncipollo/release-action@v1.14.0
        with:
          name: release-apk
          artifacts: ${{ env.APK_PATH }}
          tag: release
          allowUpdates: true
